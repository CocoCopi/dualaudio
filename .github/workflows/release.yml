name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve version and tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DUALAUDIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DUALAUDIO_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dualaudio-release.jks"

      - name: Build signed release APK
        env:
          DUALAUDIO_VERSION_NAME: ${{ steps.version.outputs.name }}
          DUALAUDIO_VERSION_CODE: ${{ github.run_number }}
          DUALAUDIO_KEYSTORE_FILE: ${{ runner.temp }}/dualaudio-release.jks
          DUALAUDIO_KEYSTORE_PASSWORD: ${{ secrets.DUALAUDIO_KEYSTORE_PASSWORD }}
          DUALAUDIO_KEY_ALIAS: ${{ secrets.DUALAUDIO_KEY_ALIAS }}
          DUALAUDIO_KEY_PASSWORD: ${{ secrets.DUALAUDIO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="DualAudio-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "DualAudio-$VERSION.apk" \
            "DualAudio-$VERSION.apk.sha256" \
            --title "Dual Audio $VERSION" \
            --generate-notes
